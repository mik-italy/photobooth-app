name: Build Photobooth APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PhotoboothApp-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.7
        name: "Photobooth App v1.0.7 - UI Monocromatica Elegante, Auto-Focus PIN, No Bordo Bianco & Uscita Stampa"
        body: |
          ### Photobooth Android v1.0.7 📸🖨️
          
          Nuovi aggiornamenti:
          - **UI Elegante e Monocromatica Coordinata:** schermata di stampa, anteprima e cattura ridisegnate nello stesso stile pulito ed elegante della Home (nero profondo, bianco ad alto contrasto, icone e controlli minimali).
          - **Apertura Immediata Tastiera PIN:** quando si apre il pannello impostazioni o si sblocca il photobooth dalla pausa, la tastiera numerica e il cursore si attivano all'istante senza dover cliccare il campo testo.
          - **Nessun Bordo Bianco su Foto Singola:** rimosso il passepartout/bordo bianco sulla foto singola orizzontale A5; lo scatto poggia ora in modo pulito e diretto sul layout e sullo sfondo scelto.
          - **Uscita Immediata da Schermata Stampa:** aggiunto il pulsante per uscire subito e tornare alla Home dalla schermata di stampa se la stampante è offline o se si desidera annullare l'attesa dei 45 secondi.
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
