name: Build Photobooth APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PhotoboothApp-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.9
        name: "Photobooth App v1.0.9 - Timer 40s, Testi Attesa Animati & Stampa 10x15 Senza Bordi Bianchi"
        body: |
          ### Photobooth Android v1.0.9 📸🖨️
          
          Nuovi aggiornamenti:
          - **Timer di Stampa a 40 Secondi:** attesa impostata a 40s per copia per rispecchiare con precisione la velocità del ciclo termico della Canon SELPHY.
          - **Testi di Attesa Dinamici e Animati:** messaggi rotanti animati ogni 7 secondi per intrattenere gli ospiti (*"Preparatevi per la prossima foto!"*, *"Cercate il vostro look perfetto!"*, *"Chi farà la posa più divertente?"*, *"La stampante sta sfornando il vostro ricordo!"*).
          - **Eliminazione Bordi Bianchi Laterali:** risoluzione e proporzioni del file allineate al formato nativo 10x15cm (1200 x 1800 px a 300 DPI) con comando IPP `print-scaling: fill` (stampa al vivo senza bordi) e sfondo disegnato a filo margine assoluto.
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
