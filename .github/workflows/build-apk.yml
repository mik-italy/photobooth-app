name: Build Photobooth APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PhotoboothApp-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.2
        name: "Photobooth App v1.0.2 - 4 Photos Strip, Full Photo Mode & UI Improvements"
        body: |
          ### Photobooth Android v1.0.2 📸🖨️
          
          Novità e miglioramenti:
          - **4 Foto per Striscia:** inserita la quarta foto nella doppia striscia 2x6 pollici.
          - **Tratteggio pulito:** eliminato il simbolo delle forbici, mantenuta la linea di taglio tratteggiata.
          - **Scelta modalità:** possibilità di selezionare sia dalla schermata iniziale che dalle impostazioni tra "Doppia Striscia (4 foto)" e "Foto Unica Intera 10x15 cm (1 foto)".
          - **Tasto Home / Annulla durante lo scatto:** ora è possibile interrompere la sessione e tornare alla home in qualsiasi momento durante il countdown.
          - **Rimossi riferimenti al PIN:** accesso immediato alle impostazioni senza schermata di blocco o PIN.
          - **Pulsante Salva in alto:** inserito in alto nella barra del titolo delle impostazioni con chiusura automatica della tastiera.
          - **Rimossi separatore/hashtag:** grafica della striscia pulita e lineare.
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
