name: Build Photobooth APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PhotoboothApp-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.5
        name: "Photobooth App v1.0.5 - Warm Flash, Multi-Copies, Custom Fonts & Dual BG"
        body: |
          ### Photobooth Android v1.0.5 📸🖨️
          
          Nuovi aggiornamenti:
          - **Flash Bianco Caldo:** luce flash a schermo calda (tono caldo naturale) con scritta 'SORRIDI! 📸' in nero.
          - **Scelta numero di copie:** selettore (1, 2, 3...) nell'anteprima prima della stampa con gestione coda adeguata.
          - **Sfondi separati (4 FOTO e 1 FOTO):** caricamento indipendente con riempimento automatico.
          - **Scelta font e opzione nascondi testo:** Playfair, Montserrat, Dancing Script, Cinzel e switch per nascondere il testo.
          - **Titolo e pulsante 'TOCCA PER INIZIARE' ancora più grandi.**
          - **Nuova password impostazioni: 3552.**
          - **Scelta 4 FOTO e 1 FOTO senza emoji.**
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
