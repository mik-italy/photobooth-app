name: Build Photobooth APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PhotoboothApp-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.2.1
        name: "Photobooth App v1.2.1 - Fix Stampa USB DNP DS40 e Diagnostica Avanzata"
        body: |
          ### Photobooth Android v1.2.1 📸🖨️🔌
          
          Risoluzione problemi e miglioramenti per la stampa via cavo USB con DNP DS40:
          - **Fix Protocollo ESC/P DNP:** corretto il calcolo esatto della lunghezza payload (2.381.888 byte per ciascun piano YMC) e allineamento dell'header DIB a 1088 byte con PadSize 10 byte (in conformità con le specifiche CUPS / Gutenprint).
          - **Sequenza Comandi Completa:** aggiunti i comandi `CNTRL RETENTION`, corretta la sequenza `CNTRL CUTTER` (attivo/disattivo) e `CNTRL BUFFCNTRL` a 0.
          - **Trasmissione Bulk a Singoli Pacchetti:** i comandi di controllo e i piani grafici vengono ora inviati a singoli blocchi USB distinti per evitare buffer underrun/confusion sul controller Renesas della stampante.
          - **Compatibilità Android 13/14 Permessi USB:** aggiornato `ACTION_USB_PERMISSION` con `RECEIVER_EXPORTED` ed explicit package per garantire che il dialog e il callback di sistema compaiano sempre.
          - **Nuovo Pannello Diagnostica DNP:** nelle impostazioni è ora presente un tasto "Diagnostica DNP DS40" che interroga seriale, firmware, stato buffer ed eventuali errori in tempo reale.
          - **Gestione Errori a Schermo:** se il cavo non è collegato, i permessi non sono concessi o la stampante riscontra un errore, un messaggio visibile e dettagliato viene mostrato a schermo anziché dare falso successo.
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
