name: Build Photobooth APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PhotoboothApp-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.8
        name: "Photobooth App v1.0.8 - Stampa Background 30s, Schermata Gadget, PIN Protetto & UI Scatto"
        body: |
          ### Photobooth Android v1.0.8 📸🖨️
          
          Nuovi aggiornamenti:
          - **Stampa 100% Invisibile in Background:** rimossa ogni finestra o dialogo di sistema Android, il lavoro IPP viaggia in modo completamente trasparente.
          - **Attesa Stampa Ridotta a 30s con Intrattenimento:** nuovo timer a 30 secondi con schermata di coinvolgimento: *"Preparatevi per la prossima foto! Scegliete i gadget e mettetevi in posa!"* e pulsante per passare subito al nuovo scatto.
          - **Scritta Flash 'SORRIDI!':** rimossa l'emoji della fotocamera durante il flash bianco caldo.
          - **Pulsante Annulla Centrato in Basso:** nella fotocamera il pulsante "Annulla" è ora posizionato al centro in basso per un facile accesso.
          - **Codice PIN Nascosto:** eliminato ogni riferimento visivo al codice 3552 dall'interfaccia.
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
