name: Build Photobooth APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PhotoboothApp-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.4
        name: "Photobooth App v1.0.4 - Playfair Bold Italic, Custom BG Scaling & Contrast"
        body: |
          ### Photobooth Android v1.0.4 📸🖨️
          
          Nuovi aggiornamenti:
          - **Font Playfair Display Bold Italic:** titolo formattato in Playfair Display Bold Italic rispettando esattamente le maiuscole/minuscole inserite (non forzato in maiuscolo).
          - **Proporzioni e Adattamento Immagine di Sfondo:** scelta tra Ritaglio Centrato (Center Crop), Riempi (Fit XY) e Mantieni Proporzioni (Fit Center).
          - **Contrasto e Personalizzazione Testo:** scelta colore testo, dimensione font e ombra/halo di contrasto automatica per garantire perfetta leggibilità su qualunque sfondo.
          - **Scritta 'SORRIDI! 📸' Nera durante il flash:** chiaramente visibile in nero al centro dello schermo mentre è attivo il flash bianco a massima luminosità.
          - **Rimossa scritta Photobooth:** eliminate le diciture "photobooth" in calce alla stampa per un layout 100% pulito e personalizzato.
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
