name: Build Photobooth APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PhotoboothApp-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.3
        name: "Photobooth App v1.0.3 - Playfair Font, Custom BG, Full Landscape Photo & 5s Timer"
        body: |
          ### Photobooth Android v1.0.3 📸🖨️
          
          Nuove funzionalità e miglioramenti grafici:
          - **Font Playfair Display:** titolo dell'evento reso più grande ed elegante con font Playfair Display sia a schermo che sulla stampa.
          - **4 Foto con massimo spazio verticale:** le foto ora occupano oltre l'85% della striscia, con un footer compatto ed elegante.
          - **Foto Unica Orizzontale (10x15):** stampa a tutto foglio orizzontale con cornice d'autore intorno.
          - **Caricamento immagine di sfondo:** possibilità di caricare una propria immagine/grafica di sfondo dal tablet tramite il selettore nelle impostazioni.
          - **Selettore in basso e nuovo colore:** selettore di formato spostato in fondo alla home con design dedicato e testo guida nascosto.
          - **Timer predefinito a 5 secondi.**
          - **Tasto 'Torna alla Home' nell'anteprima:** per annullare e resettare la postazione senza stampare.
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
