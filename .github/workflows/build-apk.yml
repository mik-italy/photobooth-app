name: Build Photobooth APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PhotoboothApp-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.1.0
        name: "Photobooth App v1.1.0 - Default IP 192.168.0.1, Maxi Testi Attesa, Pulsanti Grandi & No Testo Foto Default"
        body: |
          ### Photobooth Android v1.1.0 📸🖨️
          
          Nuovi aggiornamenti:
          - **IP Default Canon 192.168.0.1:** indirizzo IP predefinito aggiornato a `192.168.0.1`.
          - **Maxi Testi di Attesa Stampa:** messaggi di intrattenimento in stampa ingranditi (66sp, grande formato come il titolo 'Photobooth' della Home) con sottotitoli e suggerimenti accessori ben visibili a distanza.
          - **Comandi 'Rifai' e 'Torna alla Home' Ingranditi:** pulsanti nell'anteprima foto ora grandi 66dp con caratteri evidenti (18sp Bold) esattamente come il pulsante principale di stampa.
          - **Testo Sotto Foto Disattivato di Default:** sulle stampe il testo personalizzato è ora disattivato di base (può sempre essere riattivato da Impostazioni, mentre nella Home rimane sempre visibile).
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
