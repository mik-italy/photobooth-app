name: Build Photobooth APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PhotoboothApp-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.1
        name: "Photobooth App v1.0.1 - Lenovo Tab M11 & Landscape Flash Fix"
        body: |
          ### Photobooth Android v1.0.1 📸🖨️
          
          Aggiornamento con ottimizzazioni per Lenovo Tab M11:
          - **Fix avvio / crash startup:** tema Material standard e gestione sicura DecorView / Insets.
          - **Interfaccia orizzontale fissa (Landscape)** per tablet.
          - **Flash interno bianco:** lo schermo si illumina al 100% di bianco e alla massima luminosità per illuminare i volti durante lo scatto.
          - **Grafica personalizzabile per striscia:** personalizzazione singola striscia duplicata automaticamente su entrambe le colonne del foglio 10x15 cm.
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
