name: Build Photobooth APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PhotoboothApp-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.2.0
        name: "Photobooth App v1.2.0 - Supporto Stampa via Cavo USB con DNP DS40"
        body: |
          ### Photobooth Android v1.2.0 📸🖨️🔌
          
          Nuovi aggiornamenti:
          - **Supporto Stampa via Cavo USB con DNP DS40:** aggiunto driver nativo USB Host (OTG) per stampanti professionali a sublimazione DNP DS40 (VID: 0x1343, PID: 0x0003) e modelli compatibili (DS-RX1, DS620).
          - **Stampa Diretta a 300 DPI al Vivo:** generazione e streaming dei 3 piani di colore YMC (Giallo, Magenta, Ciano) a 1920 x 1240 px senza necessità di driver esterni o PC intermedi.
          - **Taglio Meccanico 2x6" Automatico:** integrazione del comando per azionare la lama interna della DS40 che divide automaticamente la stampa in due strisce 2x6 pollici separate.
          - **Finitura Lucida / Opaca:** opzione selezionabile nelle impostazioni per overcoat Lucido (Glossy) o Opaco (Matte).
          - **Selettore Stampante nelle Impostazioni:** possibilità di scegliere tra Canon SELPHY CP1500 (Wi-Fi IPP) e DNP DS40 (Cavo USB), con pulsante di test connessione dedicato e indicatore stato real-time in Home.
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
