name: Build Photobooth APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PhotoboothApp-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.1.1
        name: "Photobooth App v1.1.1 - Nuove Opzioni 3 Foto Verticali e 2 Foto Orizzontali"
        body: |
          ### Photobooth Android v1.1.1 📸🖨️
          
          Nuovi aggiornamenti:
          - **Nuova opzione 3 FOTO (Doppia Striscia Verticale 2x6"):** 3 scatti organizzati in verticale su ciascuna striscia 600x1800 px con foto ingrandite (528x440 px), linea di taglio tratteggiata centrale a 600 px e footer dedicato per testo o grafica.
          - **Nuova opzione 2 FOTO (Doppia Striscia Orizzontale 6x2"):** 2 scatti affiancati orizzontalmente (640x480 px ciascuno, rapporto 4:3) con area dedicata per logo/testo sulla destra (400 px) e linea di taglio tratteggiata centrale a Y = 600 px.
          - **Selettore Home e Impostazioni a 4 Formati:** switch immediato tra `4 FOTO`, `3 FOTO`, `2 FOTO` e `1 FOTO` sia dalla barra inferiore minimal monocromatica in Home sia dalle Impostazioni.
          - **Acquisizione dinamica:** indicatore scatti in tempo reale e pallini di progressione sincronizzati automaticamente sul numero di foto scelte (1, 2, 3 o 4 scatti).
          - **Nuovi Template Grafici:** aggiunti i template PNG guida e trasparenti a 300 DPI per tutti e 4 i formati di stampa.
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
