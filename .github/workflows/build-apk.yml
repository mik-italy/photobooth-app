name: Build Photobooth APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PhotoboothApp-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.6
        name: "Photobooth App v1.0.6 - Formato A5, Home Monocromatica, Modalità Pausa & Palette"
        body: |
          ### Photobooth Android v1.0.6 📸🖨️
          
          Nuovi aggiornamenti:
          - **Formato di Stampa A5 a 300 DPI:** il file di stampa è ora A5 (1748 x 2480 px verticale per 4 FOTO doppia striscia e 2480 x 1748 px orizzontale per 1 FOTO).
          - **Nascondi Titolo solo su Foto:** l'opzione di nascondere il titolo si applica esclusivamente alla stampa; il nome dell'evento rimane sempre visibile nella Home dell'app.
          - **Home Minimale Monocromatica:** grafica ad alto contrasto bianco e nero, icone pulite, pulsanti eleganti e minimali.
          - **Modalità 'In Pausa':** attivabile da impostazioni. Mostra l'avviso a schermo intero *"Chiama un operatore per attivare il servizio"* e si sblocca inserendo il PIN (3552).
          - **Palette Colori Sfondo e Testo:** selezione con palette di tinte unite curate ed elegante campo HEX personalizzato; testi su riga singola con auto-scaling per non troncare mai il testo.
          - **Titolo Predefinito:** impostato su *"Photobooth"*.
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
