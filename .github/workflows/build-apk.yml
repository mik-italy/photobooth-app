name: Build Photobooth APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PhotoboothApp-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub Release with APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.2.2
        name: "Photobooth App v1.2.2 - Fix Margini DNP DS40, Timer 9s e Rimozione 4 Foto"
        body: |
          ### Photobooth Android v1.2.2 📸🖨️✨

          Rilascio e ottimizzazioni specifiche per DNP DS40 e layout:
          - **Rimozione Opzione 4 Foto:** rimosso completamente il layout da 4 foto (`STRIP_4_PHOTOS`) sia dalla Home che dal menu impostazioni; ora sono selezionabili esclusivamente le modalità a **3 foto** (doppia striscia verticale 2x6"), **2 foto** (striscia orizzontale) e **1 foto** (foto singola 10x15).
          - **Timer di Stampa DNP DS40 Adattivo (9s a copia):** quando è impostata la stampante DNP DS40 via USB, il conto alla rovescia di stampa scala dinamicamente a 9 secondi per copia (es. 9s per 1 copia, 18s per 2 copie), rispecchiando esattamente la velocità termica reale dell'hardware. Per la Canon SELPHY rimane a 40s per copia.
          - **Messaggio di Ritiro Stampa Dinamico:** al termine del processo di stampa, viene mostrato il nome corretto della stampante in uso ("Ritira la stampa dalla stampante DNP DS40!" oppure "Ritira la stampa dalla stampante Canon SELPHY!").
          - **Fix Margini e Taglio DNP DS40 Pixel-Perfect:** eliminata la deformazione e lo stiramento proporzionale precedente; ora la grafica 1800x1200 a 300 DPI viene centrata 1:1 nel canvas 1920x1240 della DNP con estensione continua dei bordi nell'overbleed. I margini interni delle foto risultano identici a quelli della Canon Selphy e la linea di taglio cade esattamente a Y=620 sulla lama centrale DNP per entrambe le strisce 2x6".
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
